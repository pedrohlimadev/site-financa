name: Supabase Database Migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Escolha preview (seguro) ou apply (altera o banco)'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrations:
    runs-on: ubuntu-latest
    environment: supabase-production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: hccvcdrvqydtjtotgcco
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Confirmar secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
      - name: Conectar ao projeto Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Listar migrações
        run: supabase migration list
      - name: Prévia das migrações pendentes
        run: supabase db push --dry-run
      - name: Aplicar migrações (somente com seleção explícita)
        if: ${{ inputs.mode == 'apply' }}
        run: supabase db push
